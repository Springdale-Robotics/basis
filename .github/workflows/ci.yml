name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same branch / PR to save CI time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend lint is still skipped (no ESLint config exists yet). Typecheck is
  # now green and gated below; the job also runs the infra-free unit tests.
  backend:
    name: Backend typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund
        working-directory: backend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: backend

      - name: Unit tests (no infra required)
        # These tests don't touch the DB/Redis, but importing the app's config
        # module validates env on load (and exits if it's missing), so provide
        # syntactically-valid dummy values.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-session-secret-not-used-in-ci-000000
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        run: npx vitest run src/lib/units.test.ts src/lib/confidence.test.ts src/services/crf-ingredient-parser.test.ts test/lib/tailscale.test.ts
        working-directory: backend

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend
