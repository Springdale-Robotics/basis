name: Release

on:
  push:
    tags:
      - 'v*'
  # Allow running the pre-flight verify on demand (from any branch) without
  # cutting a release — the publish job below is guarded to tags only.
  workflow_dispatch:

# Permissions for creating the GitHub Release and uploading assets.
permissions:
  contents: write

jobs:
  # Gate the release on a full pre-flight: the exact artifact must typecheck,
  # pass tests, build, migrate a fresh database, and actually boot and serve
  # health — all before a tarball is published for the prod self-updater to
  # pull. A red verify blocks the release entirely.
  verify:
    name: Verify build (typecheck, tests, build, migrate, boot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-not-used-in-ci-000000
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend install
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Backend typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Backend unit tests
        working-directory: backend
        run: npx vitest run src/lib/units.test.ts src/lib/confidence.test.ts src/services/crf-ingredient-parser.test.ts test/lib/tailscale.test.ts

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Migrations apply on a fresh database
        working-directory: backend
        run: npm run db:migrate

      - name: Boot smoke test (build boots + serves health)
        working-directory: backend
        env:
          NODE_ENV: production
          PORT: '3000'
          WORKERS_IN_PROCESS: 'true'
        run: |
          node dist/index.js &
          APP_PID=$!
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/api/v1/health/live >/dev/null 2>&1; then
              echo "App booted and is serving /health/live"
              ok=1
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::Backend process exited during boot"
              wait "$APP_PID" || true
              exit 1
            fi
            sleep 1
          done
          kill "$APP_PID" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::Backend did not become healthy within 45s"
            exit 1
          fi

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  release:
    name: Build tarball + publish release
    needs: verify
    # Only publish for real tag pushes; a manual workflow_dispatch just runs verify.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tag annotation is the release notes — need full history.
          fetch-depth: 0

      - id: version
        name: Resolve version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"           # e.g. v0.1.0-alpha
          VERSION="${TAG#v}"                  # strip leading 'v'
          # Pre-release if it has a suffix (alpha, beta, rc, ...).
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $TAG"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Stage tarball contents
        run: |
          # Layout mirrors what install.sh expects from a checkout: the full
          # source tree with frontend/dist/ already built. install.sh runs
          # npm ci on the backend at install time so we don't ship
          # node_modules — platform-specific native modules like node-pty
          # need to be built on the target host.
          STAGE=staging/basis-${{ steps.version.outputs.version }}
          mkdir -p "$STAGE"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='**/node_modules' \
            --exclude='backend/dist' \
            --exclude='backend/storage' \
            --exclude='backend/bin' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='staging' \
            --exclude='*.tar.gz' \
            ./ "$STAGE/"
          # Bake the version in so the running app knows what it is.
          echo "${{ steps.version.outputs.version }}" > "$STAGE/VERSION"

      - name: Pack tarball
        run: |
          cd staging
          tar -czf ../basis-${{ steps.version.outputs.version }}.tar.gz basis-${{ steps.version.outputs.version }}
          cd ..
          sha256sum basis-${{ steps.version.outputs.version }}.tar.gz \
            | tee basis-${{ steps.version.outputs.version }}.tar.gz.sha256
          ls -lh basis-${{ steps.version.outputs.version }}.tar.gz*

      - name: Compose release notes from tag annotation
        id: notes
        run: |
          # actions/checkout leaves refs/tags/<name> as a LIGHTWEIGHT ref
          # pointing straight at the commit, even with fetch-depth: 0 — the
          # annotation is peeled away. %(contents) then quietly returns the
          # commit message instead, which is why every release so far had to
          # have its notes rewritten by hand. Fetch the real tag object back.
          git fetch origin --force "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

          if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]; then
            echo "::warning::${GITHUB_REF_NAME} is not an annotated tag — release notes will fall back to a placeholder."
          fi

          # Use the annotation message of the tag as the release body. Falls
          # back to a default if the tag was lightweight (no annotation).
          NOTES="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          if [ -z "$NOTES" ]; then
            NOTES="Release ${GITHUB_REF_NAME}"
          fi
          {
            echo 'notes<<__EOF__'
            echo "$NOTES"
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "curl -fL https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/basis-${{ steps.version.outputs.version }}.tar.gz | tar -xz"
            echo "sudo bash basis-${{ steps.version.outputs.version }}/backend/deploy/native/install.sh --source basis-${{ steps.version.outputs.version }}"
            echo '```'
            echo
            echo "Basis installs natively (Node/Postgres/Redis + systemd); there"
            echo "is no Docker image. Local development still uses Docker for"
            echo "Postgres/Redis/Ollama via backend/docker-compose.dev.yml."
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            basis-*.tar.gz
            basis-*.tar.gz.sha256
